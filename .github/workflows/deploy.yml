name: Deploy to Railway

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Pull Railway environment variables
        run: railway variables > .env

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_NAME }}

      - name: 🐳 Start Docker containers with env vars
        run: docker-compose --env-file .env up -d --build

      - name: ⏱ Wait for services to be healthy
        run: |
          echo "Waiting for db and redis to be healthy..."
          for i in {1..30}; do
            DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker-compose ps -q db))
            REDIS_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker-compose ps -q redis))
            if [ "$DB_STATUS" == "healthy" ] && [ "$REDIS_STATUS" == "healthy" ]; then
              echo "✅ All services healthy!"
              break
            fi
            echo "⏳ Still waiting... ($i/30)"
            sleep 5
          done

      - name: 🧪 Run Unit and E2E Tests inside app container
        run: |
          APP_CONTAINER=$(docker-compose ps -q app)
          docker exec "$APP_CONTAINER" npm run test
